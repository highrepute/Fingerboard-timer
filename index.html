<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fingerboard Timer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17130E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Applied before the page renders so a light-theme user doesn't see a dark
  // flash on load. The main script re-applies this and wires up the toggle.
  try {
    if (localStorage.getItem('fingerboard-timer-theme') === 'light') {
      document.documentElement.classList.add('light-theme');
    }
  } catch (e) {}
</script>
<style>
  @font-face {
    font-family: 'Oswald';
    src: local('Oswald');
  }
  :root {
    --bg: #17130E;
    --surface: #221B13;
    --surface-2: #2B2318;
    --chalk: #EAE2D0;
    --chalk-dim: #A69B87;
    --hang: #B8451E;
    --hang-dim: #5C2C18;
    --rest: #4C7072;
    --rest-dim: #28393A;
    --restset: #8A7A4E;
    --restset-dim: #3D3623;
    --ready: #D4A72C;
    --line: #3A3024;
  }
  /* Light theme lives on the root element, not body: html paints the area
     revealed by scrolling or overscroll, so if these vars were scoped to body
     that region would keep rendering in the dark palette. */
  :root.light-theme {
    --bg: #F2EBDA;
    --surface: #E7DFC8;
    --surface-2: #DCD2B4;
    --chalk: #2B2116;
    --chalk-dim: #7A6F58;
    --hang: #A63D19;
    --hang-dim: #E7C3AE;
    --rest: #386163;
    --rest-dim: #C4D6D6;
    --restset: #6E6138;
    --restset-dim: #DED6BB;
    --ready: #9C7A16;
    --line: #CFC4A4;
  }
  .light-theme .state-label.hang,
  .light-theme .state-label.rest,
  .light-theme .state-label.restset,
  .light-theme .state-label.ready {
    color: #F2EBDA;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--chalk);
    font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    padding: 18px 20px 24px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 19px;
    margin: 0;
    color: var(--chalk);
  }
  .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--chalk-dim);
    letter-spacing: 0.03em;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .theme-btn {
    flex: none;
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--chalk);
    border: 1px solid var(--line);
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .theme-btn:active { transform: scale(0.92); }

  /* HERO */
  .hero {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transition: margin-top 0.22s ease;
  }
  body.setup-collapsed .hero { margin-top: 72px; }
  body:not(.setup-collapsed) .hero { margin-top: 18px; }
  /* Three equal-flanked columns: the phase pill sits in the centre column and
     stays exactly centred on screen, while the hand box occupies the right
     flank. Because the outer columns are both 1fr, showing or hiding the hand
     box never nudges the pill off centre. */
  .label-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: 100%;
  }
  .label-row > .state-label:first-of-type { grid-column: 2; }
  /* Its own box, matching the pill's height, colour and type — it shares the
     .state-label class for exactly that reason, and only overrides its width
     so a single letter sits in a box that never changes size. */
  .hand-badge {
    grid-column: 3;
    justify-self: start;
    margin-left: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.1em;
    padding-left: 0;
    padding-right: 0;
    letter-spacing: 0;
  }
  .hand-badge[hidden] { display: none; }
  /* The pill is width-locked to its longest possible label so it stops
     resizing as the phase changes. An invisible copy of that label shares the
     single grid cell with the live text, so the box always measures to the
     wider of the two — which keeps it correct if the font falls back, and lets
     it still scale with font-size between the open and collapsed states. */
  .state-label {
    display: grid;
    justify-items: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 15px;
    padding: 7px 16px;
    border-radius: 3px;
    transition: background-color 0.25s ease, color 0.25s ease, font-size 0.22s ease;
    background: var(--surface-2);
    color: var(--chalk-dim);
    max-width: 100%;
  }
  .state-label-sizer,
  .state-label-text {
    grid-area: 1 / 1;
    white-space: nowrap;
  }
  .state-label-sizer { visibility: hidden; }
  body.setup-collapsed .state-label { font-size: 23px; padding: 10px 20px; }
  .state-label.hang { background: var(--hang); color: #1a0d06; }
  .state-label.rest { background: var(--rest); color: #0a1616; }
  .state-label.restset { background: var(--restset); color: #1a1608; }
  .state-label.ready { background: var(--ready); color: #241a02; }

  .timer-num {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 600;
    font-size: 25vw;
    line-height: 0.9;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    transition: color 0.25s ease, font-size 0.22s ease;
  }
  @media (min-width: 480px) { .timer-num { font-size: 120px; } }
  body.setup-collapsed .timer-num { font-size: 38vw; }
  @media (min-width: 480px) { body.setup-collapsed .timer-num { font-size: 190px; } }
  .timer-num.hang { color: var(--hang); }
  .timer-num.rest { color: var(--rest); }
  .timer-num.restset { color: var(--restset); }
  .timer-num.ready { color: var(--ready); }
  .timer-num.idle { color: var(--chalk-dim); }

  .progress-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 20px;
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    /* Scales with the screen so long values (SET 20/20 REP 30/30 LEFT 77:50)
       stay on one line on a normal phone, and wrap rather than overflow if not. */
    font-size: clamp(15px, 4.4vw, 19px);
    color: var(--chalk-dim);
    letter-spacing: 0.03em;
    transition: font-size 0.22s ease;
  }
  body.setup-collapsed .progress-row { font-size: clamp(17px, 5.2vw, 23px); }
  .progress-row b { color: var(--chalk); font-weight: 600; }

  /* CONTROLS */
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 22px;
  }
  button {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    padding: 14px 0;
    flex: 1;
    cursor: pointer;
    color: var(--bg);
    background: var(--chalk);
    transition: transform 0.08s ease, opacity 0.15s ease, padding 0.22s ease, font-size 0.22s ease;
  }
  body.setup-collapsed .controls:not(.controls-secondary) button {
    font-size: 19px;
    padding: 20px 0;
    border-radius: 10px;
  }
  /* Mid-session helpers — deliberately smaller than Start/Reset so the primary
     controls stay the obvious targets when glancing over mid-hang. */
  .controls-secondary {
    margin-top: 10px;
  }
  .controls-secondary button {
    font-size: 13px;
    padding: 11px 0;
  }
  body.setup-collapsed .controls-secondary button {
    font-size: 15px;
    padding: 13px 0;
  }
  button:active { transform: scale(0.97); }
  button.secondary {
    background: transparent;
    color: var(--chalk-dim);
    border: 1px solid var(--line);
  }
  button:focus-visible { outline: 2px solid var(--ready); outline-offset: 2px; }
  button:disabled { opacity: 0.4; }

  /* CONFIG */
  .config {
    margin-top: 26px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  .config-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: transparent;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    padding: 4px 0;
    margin-bottom: 4px;
    cursor: pointer;
  }
  .chevron {
    font-size: 13px;
    transition: transform 0.2s ease;
  }
  .config-title[aria-expanded="false"] .chevron,
  .config-title[aria-expanded="false"] #configChevron {
    transform: rotate(-90deg);
  }
  .config-body {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.22s ease;
  }
  .config-body-inner { overflow: hidden; min-height: 0; }
  .config.collapsed .config-body {
    grid-template-rows: 0fr;
  }
  .preset-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .preset-btn {
    flex: 1;
    background: var(--surface);
    color: var(--chalk-dim);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 0;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .preset-btn:active { transform: scale(0.97); }
  .preset-btn:disabled { opacity: 0.35; }
  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .field {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--chalk-dim);
    letter-spacing: 0.03em;
    margin-bottom: 3px;
  }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--chalk);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    padding: 0;
    text-align: center;
    -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field input:focus { outline: none; }
  .field input:focus-visible { outline: 2px solid var(--ready); outline-offset: 2px; border-radius: 3px; }
  .field-unit {
    font-size: 10px;
    color: var(--chalk-dim);
    margin-left: 4px;
  }
  .stepper {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stepper input { flex: 1; min-width: 0; }
  .stepper button {
    flex: none;
    width: 24px;
    height: 24px;
    padding: 0;
    border-radius: 5px;
    background: var(--surface-2);
    color: var(--chalk);
    border: 1px solid var(--line);
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stepper button:active { transform: scale(0.94); background: var(--surface); }
  .stepper button:disabled { opacity: 0.35; }

  .sound-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 12px;
    color: var(--chalk-dim);
  }
  /* Three-state control (Off / L / R) — tap to cycle. Sized to match the
     adjacent on/off toggles so the settings rows stay visually consistent. */
  .cycle-btn {
    flex: none;
    min-width: 52px;
    padding: 4px 10px;
    border-radius: 11px;
    background: var(--surface-2);
    color: var(--chalk-dim);
    border: 1px solid var(--line);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .cycle-btn.active {
    background: var(--hang);
    color: var(--bg);
    border-color: var(--hang);
  }
  .cycle-btn:active { transform: scale(0.95); }
  .toggle {
    position: relative;
    width: 40px; height: 22px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 11px;
    cursor: pointer;
  }
  .toggle .knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--chalk-dim);
    transition: left 0.15s ease, background-color 0.15s ease;
  }
  .toggle.on .knob { left: 20px; background: var(--hang); }

  footer {
    text-align: center;
    font-size: 10px;
    color: var(--line);
    margin-top: 20px;
    letter-spacing: 0.05em;
  }

  @media (prefers-reduced-motion: reduce) {
    .timer-num, .state-label { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fingerboard</h1>
    <div class="header-right">
      <div class="subtitle" id="statusText">Ready to set up</div>
      <button type="button" class="theme-btn" id="themeToggle" aria-label="Toggle light/dark theme">☾</button>
    </div>
  </header>

  <div class="hero">
    <div class="label-row">
      <div class="state-label idle" id="stateLabel"><span class="state-label-sizer" aria-hidden="true">GET READY</span><span class="state-label-text" id="stateLabelText">READY</span></div>
      <div class="state-label hand-badge idle" id="handBadge" hidden>L</div>
    </div>
    <div class="timer-num idle" id="timerNum">–</div>
    <div class="progress-row">
      <div>SET <b id="setNow">–</b>/<span id="setTotal">–</span></div>
      <div>REP <b id="repNow">–</b>/<span id="repTotal">–</span></div>
      <div>TIME <b id="timeLeft">–</b></div>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="resetBtn" class="secondary">Reset</button>
  </div>

  <div class="controls controls-secondary">
    <button id="restartSetBtn" class="secondary">Restart set</button>
    <button id="addSetBtn" class="secondary">+ Add set</button>
  </div>

  <div class="config">
    <button type="button" class="config-title" id="configToggle" aria-expanded="true">
      <span>Session setup</span>
      <span class="chevron" id="configChevron">▾</span>
    </button>
    <div class="config-body" id="configBody">
      <div class="config-body-inner">      <div class="preset-row">
        <button type="button" class="preset-btn" id="presetRepeaters">Repeaters</button>
        <button type="button" class="preset-btn" id="presetMaxHangs">Max hangs</button>
      </div>
      <div class="field-grid">
        <div class="field">
          <label>Sets</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-target="cfgSets" aria-label="Decrease sets">−</button>
            <input type="number" id="cfgSets" value="4" min="1" max="20" inputmode="numeric">
            <button type="button" data-step="1" data-target="cfgSets" aria-label="Increase sets">+</button>
          </div>
        </div>
        <div class="field">
          <label>Reps per set</label>
          <div class="stepper">
            <button type="button" data-step="-1" data-target="cfgReps" aria-label="Decrease reps">−</button>
            <input type="number" id="cfgReps" value="6" min="1" max="30" inputmode="numeric">
            <button type="button" data-step="1" data-target="cfgReps" aria-label="Increase reps">+</button>
          </div>
        </div>
        <div class="field">
          <label>Rep time <span class="field-unit">sec</span></label>
          <div class="stepper">
            <button type="button" data-step="-1" data-target="cfgRepTime" aria-label="Decrease rep time">−</button>
            <input type="number" id="cfgRepTime" value="7" min="1" max="120" inputmode="numeric">
            <button type="button" data-step="1" data-target="cfgRepTime" aria-label="Increase rep time">+</button>
          </div>
        </div>
        <div class="field">
          <label>Rest between reps <span class="field-unit">sec</span></label>
          <div class="stepper">
            <button type="button" data-step="-1" data-target="cfgRestRep" aria-label="Decrease rest between reps">−</button>
            <input type="number" id="cfgRestRep" value="3" min="0" max="300" inputmode="numeric">
            <button type="button" data-step="1" data-target="cfgRestRep" aria-label="Increase rest between reps">+</button>
          </div>
        </div>
        <div class="field" style="grid-column: 1 / -1;">
          <label>Rest between sets <span class="field-unit">sec</span></label>
          <div class="stepper">
            <button type="button" data-step="-5" data-target="cfgRestSet" aria-label="Decrease rest between sets">−</button>
            <input type="number" id="cfgRestSet" value="180" min="0" max="1800" inputmode="numeric">
            <button type="button" data-step="5" data-target="cfgRestSet" aria-label="Increase rest between sets">+</button>
          </div>
        </div>
      </div>
      <div class="sound-row">
        <span>Sound</span>
        <div class="toggle on" id="soundToggle"><div class="knob"></div></div>
      </div>
      <div class="sound-row">
        <span>Tick</span>
        <div class="toggle on" id="tickToggle"><div class="knob"></div></div>
      </div>
      <div class="sound-row">
        <span>Alternate hands</span>
        <button type="button" class="cycle-btn" id="handToggle" aria-label="Cycle hand alternation: off, start left, start right">Off</button>
      </div>
      </div>
    </div>
  </div>

  <footer>v15 · Keep screen awake while training · works offline</footer>
</div>

<script>
(function() {
  // ---- Elements ----
  const stateLabel = document.getElementById('stateLabel');
  const stateLabelText = document.getElementById('stateLabelText');
  const timerNum = document.getElementById('timerNum');
  const setNow = document.getElementById('setNow');
  const setTotal = document.getElementById('setTotal');
  const repNow = document.getElementById('repNow');
  const repTotal = document.getElementById('repTotal');
  const timeLeftEl = document.getElementById('timeLeft');
  const handBadge = document.getElementById('handBadge');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const restartSetBtn = document.getElementById('restartSetBtn');
  const addSetBtn = document.getElementById('addSetBtn');
  const statusText = document.getElementById('statusText');
  const tickToggle = document.getElementById('tickToggle');
  const handToggle = document.getElementById('handToggle');
  const soundToggle = document.getElementById('soundToggle');

  const cfgSets = document.getElementById('cfgSets');
  const cfgReps = document.getElementById('cfgReps');
  const cfgRepTime = document.getElementById('cfgRepTime');
  const cfgRestRep = document.getElementById('cfgRestRep');
  const cfgRestSet = document.getElementById('cfgRestSet');
  const configInputs = [cfgSets, cfgReps, cfgRepTime, cfgRestRep, cfgRestSet];
  const presetButtons = [
    document.getElementById('presetRepeaters'),
    document.getElementById('presetMaxHangs'),
  ];

  const PREFS_KEY = 'fingerboard-timer-prefs';

  function applyPreset(values) {
    cfgSets.value = values.sets;
    cfgReps.value = values.reps;
    cfgRepTime.value = values.repTime;
    cfgRestRep.value = values.restRep;
    cfgRestSet.value = values.restSet;
    savePrefs();
    if (!sessionActive) render(); // refresh the idle time-remaining preview
  }
  document.getElementById('presetRepeaters').addEventListener('click', () => {
    applyPreset({ sets: 4, reps: 6, repTime: 7, restRep: 3, restSet: 180 });
  });
  document.getElementById('presetMaxHangs').addEventListener('click', () => {
    applyPreset({ sets: 5, reps: 1, repTime: 10, restRep: 0, restSet: 180 });
  });

  let tickEnabled = true;
  tickToggle.addEventListener('click', () => {
    tickEnabled = !tickEnabled;
    tickToggle.classList.toggle('on', tickEnabled);
    savePrefs();
  });

  let soundEnabled = true;
  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggle.classList.toggle('on', soundEnabled);
    savePrefs();
  });

  // Hand alternation for one-arm work: 'off', or 'L'/'R' meaning which hand set 1
  // uses. Subsequent sets alternate from there.
  let handStart = 'off'; // 'off' | 'L' | 'R'
  const HAND_CYCLE = { off: 'L', L: 'R', R: 'off' };

  function handForSet(setNo) {
    if (handStart === 'off') return null;
    // Odd sets get the starting hand, even sets the other one.
    const startsLeft = handStart === 'L';
    const isOddSet = setNo % 2 === 1;
    return (isOddSet === startsLeft) ? 'L' : 'R';
  }

  function renderHandToggle() {
    handToggle.textContent = handStart === 'off' ? 'Off' : 'Start ' + handStart;
    handToggle.classList.toggle('active', handStart !== 'off');
  }

  handToggle.addEventListener('click', () => {
    handStart = HAND_CYCLE[handStart];
    renderHandToggle();
    savePrefs();
    render(); // badge appears/disappears immediately
  });

  // Remember the last-used numbers and sound switches, so the app opens ready
  // to go rather than back at the defaults every time.
  function savePrefs() {
    try {
      localStorage.setItem(PREFS_KEY, JSON.stringify({
        sets: cfgSets.value, reps: cfgReps.value, repTime: cfgRepTime.value,
        restRep: cfgRestRep.value, restSet: cfgRestSet.value,
        tickEnabled, soundEnabled, handStart,
      }));
    } catch (e) {}
  }
  function loadPrefs() {
    let p;
    try {
      const raw = localStorage.getItem(PREFS_KEY);
      if (!raw) return;
      p = JSON.parse(raw);
    } catch (e) { return; }
    if (!p || typeof p !== 'object') return;
    const set = (el, v) => { if (v !== undefined && v !== null && v !== '') el.value = v; };
    set(cfgSets, p.sets); set(cfgReps, p.reps); set(cfgRepTime, p.repTime);
    set(cfgRestRep, p.restRep); set(cfgRestSet, p.restSet);
    if (typeof p.tickEnabled === 'boolean') {
      tickEnabled = p.tickEnabled;
      tickToggle.classList.toggle('on', tickEnabled);
    }
    if (typeof p.soundEnabled === 'boolean') {
      soundEnabled = p.soundEnabled;
      soundToggle.classList.toggle('on', soundEnabled);
    }
    if (['off', 'L', 'R'].includes(p.handStart)) handStart = p.handStart;
    renderHandToggle();
  }

  const themeToggle = document.getElementById('themeToggle');
  const THEME_KEY = 'fingerboard-timer-theme';
  const themeColorMeta = document.querySelector('meta[name="theme-color"]');

  function applyTheme(isLight) {
    // On documentElement, not body — see the :root.light-theme note in the CSS.
    document.documentElement.classList.toggle('light-theme', isLight);
    themeToggle.textContent = isLight ? '☀' : '☾';
    // Keep the browser's own UI chrome in step with the palette.
    if (themeColorMeta) themeColorMeta.setAttribute('content', isLight ? '#F2EBDA' : '#17130E');
  }
  themeToggle.addEventListener('click', () => {
    const isLight = !document.documentElement.classList.contains('light-theme');
    applyTheme(isLight);
    try { localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark'); } catch (e) {}
  });
  try { applyTheme(localStorage.getItem(THEME_KEY) === 'light'); } catch (e) {}

  const configEl = document.querySelector('.config');
  const configToggle = document.getElementById('configToggle');
  configToggle.addEventListener('click', () => {
    setConfigCollapsed(!configEl.classList.contains('collapsed'));
  });

  document.querySelectorAll('.stepper button').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      if (!target || target.disabled) return;
      const step = parseInt(btn.dataset.step, 10);
      const min = parseInt(target.min, 10);
      const max = parseInt(target.max, 10);
      const cur = parseInt(target.value, 10) || 0;
      const next = Math.min(max, Math.max(min, cur + step));
      target.value = next;
      savePrefs();
      if (!sessionActive) render(); // keep the idle time-remaining preview in sync
    });
  });

  // Typed-in edits should stick too, not just stepper taps.
  configInputs.forEach((input) => {
    input.addEventListener('change', () => {
      savePrefs();
      if (!sessionActive) render();
    });
  });

  // ---- Audio (generated, no external files) ----
  let actx = null;
  function ensureAudio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }
  // Browsers block audio until the page has seen a user gesture. Start/Resume call
  // ensureAudio() directly, but a session restored after a reload starts ticking
  // without any tap — so arm the audio on the first interaction of any kind,
  // otherwise a restored session would count down completely silently.
  ['pointerdown', 'keydown'].forEach((evt) => {
    document.addEventListener(evt, ensureAudio, { once: true });
  });
  function beep(freq, duration, gain, type) {
    if (!actx) return;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.value = 0;
    osc.connect(g);
    g.connect(actx.destination);
    const now = actx.currentTime;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(gain, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function playTick() {
    if (!tickEnabled || !soundEnabled) return;
    beep(1600, 0.045, 0.14, 'square');
  }
  function playRepStart() {
    if (!soundEnabled) return;
    beep(880, 0.6, 0.32, 'sine');
  }
  function playRepEnd() {
    if (!soundEnabled) return;
    beep(440, 0.6, 0.32, 'sine');
  }
  function playSetDone() {
    if (!soundEnabled) return;
    beep(660, 0.9, 0.32, 'sine');
  }
  function playAllDone() {
    if (!soundEnabled) return;
    beep(660, 0.35, 0.32, 'sine');
    setTimeout(() => beep(880, 1.1, 0.32, 'sine'), 380);
  }

  // ---- Wake lock (best-effort; keeps screen on during a session where supported) ----
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { /* ignore — not fatal if unsupported or denied */ }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  // ---- Session model ----
  // Phases: ready -> hang -> rest (between reps) -> hang -> ... -> restset (between sets) -> ... -> done
  let plan = null;      // { sets, reps, repTime, restRep, restSet }
  let running = false;
  let sessionActive = false; // true from first Start until Reset (paused sessions stay active)
  let phase = 'idle';   // idle | ready | hang | rest | restset | done
  let curSet = 1, curRep = 1;
  let secondsLeft = 0;
  let phaseTotal = 0;
  // phaseStartedAt is the IDEAL wall-clock instant the current phase began — chained
  // continuously from session start (each new phase's anchor = previous anchor + previous
  // duration), never just "whenever the code happened to run." That means the remaining
  // time is always correct from Date.now() alone, however long a gap (a throttled timer,
  // a backgrounded tab, or the browser fully discarding and reloading the page) turns out
  // to be — there's no separate "catch-up" logic to keep in sync, just one formula.
  let phaseStartedAt = 0;
  let pausedRemainingMs = 0; // remaining ms in the phase, captured at pause time
  let intervalId = null;
  let suppressSound = false; // true while silently fast-forwarding through elapsed phases on restore

  const READY_SECONDS = 10;
  const STORAGE_KEY = 'fingerboard-timer-session-v1';

  function readConfig() {
    return {
      sets: clampInt(cfgSets.value, 1, 20, 4),
      reps: clampInt(cfgReps.value, 1, 30, 6),
      repTime: clampInt(cfgRepTime.value, 1, 120, 7),
      restRep: clampInt(cfgRestRep.value, 0, 300, 3),
      restSet: clampInt(cfgRestSet.value, 0, 1800, 180),
    };
  }
  function clampInt(v, min, max, fallback) {
    const n = parseInt(v, 10);
    if (isNaN(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function setConfigDisabled(disabled) {
    configInputs.forEach(i => i.disabled = disabled);
    presetButtons.forEach(b => { if (b) b.disabled = disabled; });
  }

  function updateStaticDisplay() {
    setTotal.textContent = plan ? plan.sets : '–';
    repTotal.textContent = plan ? plan.reps : '–';
  }

  function renderPhaseChrome() {
    stateLabel.className = 'state-label';
    timerNum.className = 'timer-num';
    let label = 'READY';
    let cls = 'ready';
    if (phase === 'hang') { label = 'HANG'; cls = 'hang'; }
    else if (phase === 'rest') { label = 'REST'; cls = 'rest'; }
    else if (phase === 'restset') { label = 'SET REST'; cls = 'restset'; }
    else if (phase === 'ready') { label = 'GET READY'; cls = 'ready'; }
    else if (phase === 'done') { label = 'COMPLETE'; cls = 'hang'; }
    else { label = 'READY'; cls = 'idle'; }
    stateLabel.classList.add(cls === 'idle' ? 'idle' : cls);
    timerNum.classList.add(cls === 'idle' ? 'idle' : cls);
    // The hand box carries the same phase class so its colour tracks the pill's.
    handBadge.className = 'state-label hand-badge ' + (cls === 'idle' ? 'idle' : cls);
    // Write to the inner span only — setting textContent on the pill itself
    // would delete the hidden sizer that width-locks it.
    stateLabelText.textContent = label;
  }

  // Total seconds still to run in the whole session: what's left of the current
  // phase, plus every phase still queued after it. Walks the same transition rules
  // the timer itself uses, so it stays exact rather than approximate.
  function sessionSecondsRemaining() {
    if (!plan || phase === 'idle' || phase === 'done') return null;
    let total = Math.max(0, secondsLeft);
    let ph = phase, cs = curSet, cr = curRep;
    let guard = plan.sets * plan.reps * 2 + 10;
    while (guard-- > 0) {
      if (ph === 'ready') { ph = 'hang'; total += plan.repTime; continue; }
      if (ph === 'rest' || ph === 'restset') { ph = 'hang'; total += plan.repTime; continue; }
      // ph === 'hang'
      if (cr < plan.reps) {
        cr++;
        if (plan.restRep > 0) { ph = 'rest'; total += plan.restRep; }
        else { ph = 'hang'; total += plan.repTime; }
        continue;
      }
      if (cs >= plan.sets) break; // last rep of last set — nothing follows
      cs++; cr = 1;
      if (plan.restSet > 0) { ph = 'restset'; total += plan.restSet; }
      else { ph = 'hang'; total += plan.repTime; }
    }
    return total;
  }

  function formatDuration(secs) {
    if (secs === null) return '–';
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  // What the whole session will take, based on the numbers currently in the
  // config fields — shown before you start so you know the time commitment.
  function plannedSessionSeconds(cfg) {
    const hangs = cfg.sets * cfg.reps;
    const repRests = cfg.sets * (cfg.reps - 1) * cfg.restRep;
    const setRests = (cfg.sets - 1) * cfg.restSet;
    return READY_SECONDS + hangs * cfg.repTime + repRests + setRests;
  }

  function render() {
    renderPhaseChrome();
    timerNum.textContent = phase === 'done' ? '✓' : (phase === 'idle' ? '–' : secondsLeft);
    setNow.textContent = plan ? curSet : '–';
    repNow.textContent = plan ? curRep : '–';
    if (phase === 'done') {
      timeLeftEl.textContent = '0:00';
    } else if (phase === 'idle') {
      // Not started yet — preview the total for the current settings.
      timeLeftEl.textContent = formatDuration(plannedSessionSeconds(readConfig()));
    } else {
      timeLeftEl.textContent = formatDuration(sessionSecondsRemaining());
    }
    // Hand badge: shown whenever alternation is on and there's a live set to
    // label — including the get-ready countdown, so you know which hand to set
    // up with before the set starts. Idle previews set 1's hand.
    if (handStart === 'off' || phase === 'done') {
      handBadge.hidden = true;
    } else {
      const hand = handForSet(phase === 'idle' ? 1 : curSet);
      handBadge.hidden = false;
      handBadge.textContent = hand;
    }
    updateSecondaryControls();
    saveState();
  }

  // newPhase's anchor chains from the phase it replaces — pass the previous phase's
  // (phaseStartedAt + phaseTotal) as `anchor` for a transition, or omit it for a
  // brand-new session (anchor defaults to right now).
  function startPhase(newPhase, seconds, anchor) {
    phase = newPhase;
    secondsLeft = seconds;
    phaseTotal = seconds;
    phaseStartedAt = anchor !== undefined ? anchor : Date.now();
    render();
  }

  // Real remaining seconds in the current phase, from the wall clock — correct
  // however long it's been since we last checked, including a negative value if
  // whole phases have elapsed unnoticed (backgrounded tab, reload, etc).
  function computeSecondsLeft() {
    return phaseTotal - Math.floor((Date.now() - phaseStartedAt) / 1000);
  }

  function checkTimer() {
    if (!running) return;
    let remaining = computeSecondsLeft();
    if (remaining > 0) {
      if (remaining !== secondsLeft) {
        secondsLeft = remaining;
        if ((phase === 'hang' || phase === 'rest') && secondsLeft <= 3) playTick();
        else if (phase === 'restset' && secondsLeft <= 10) playTick();
        else if (phase === 'ready' && secondsLeft <= 3) playTick();
        render();
      }
      return;
    }
    // One or more phase boundaries have passed — each advancePhase() call chains
    // its anchor from the last, so this always lands in exactly the right spot.
    let guard = plan ? plan.sets * plan.reps * 2 + 10 : 100;
    while (running && phase !== 'done' && computeSecondsLeft() <= 0 && guard-- > 0) {
      advancePhase();
    }
    if (running && phase !== 'done') {
      secondsLeft = computeSecondsLeft();
      render();
    }
  }

  function advancePhase() {
    const nextAnchor = phaseStartedAt + phaseTotal * 1000;
    if (phase === 'ready') {
      if (!suppressSound) playRepStart();
      startPhase('hang', plan.repTime, nextAnchor);
      statusText.textContent = 'Training…';
      return;
    }
    if (phase === 'hang') {
      if (!suppressSound) playRepEnd();
      const isLastRepOfSet = curRep >= plan.reps;
      if (!isLastRepOfSet) {
        curRep += 1;
        if (plan.restRep > 0) {
          startPhase('rest', plan.restRep, nextAnchor);
        } else {
          if (!suppressSound) playRepStart();
          startPhase('hang', plan.repTime, nextAnchor);
        }
      } else {
        const isLastSet = curSet >= plan.sets;
        if (isLastSet) {
          finishSession();
        } else {
          curSet += 1;
          curRep = 1;
          if (plan.restSet > 0) {
            startPhase('restset', plan.restSet, nextAnchor);
            if (!suppressSound) playSetDone();
          } else {
            if (!suppressSound) playRepStart();
            startPhase('hang', plan.repTime, nextAnchor);
          }
        }
      }
      render();
      return;
    }
    if (phase === 'rest') {
      if (!suppressSound) playRepStart();
      startPhase('hang', plan.repTime, nextAnchor);
      render();
      return;
    }
    if (phase === 'restset') {
      if (!suppressSound) playRepStart();
      startPhase('hang', plan.repTime, nextAnchor);
      render();
      return;
    }
  }

  function finishSession() {
    clearInterval(intervalId);
    intervalId = null;
    running = false;
    sessionActive = false;
    phase = 'done';
    secondsLeft = 0;
    phaseTotal = 0;
    if (!suppressSound) playAllDone();
    render();
    statusText.textContent = 'Nice work';
    startBtn.textContent = 'Start';
    releaseWakeLock();
    clearSavedState();
  }

  function setConfigCollapsed(collapsed) {
    configEl.classList.toggle('collapsed', collapsed);
    configToggle.setAttribute('aria-expanded', String(!collapsed));
    document.body.classList.toggle('setup-collapsed', collapsed);
  }

  function startSession() {
    ensureAudio();
    plan = readConfig();
    setConfigDisabled(true);
    setConfigCollapsed(true);
    updateStaticDisplay();
    curSet = 1;
    curRep = 1;
    running = true;
    sessionActive = true;
    statusText.textContent = 'Get ready…';
    startBtn.textContent = 'Pause';
    requestWakeLock();
    startPhase('ready', READY_SECONDS);
    intervalId = setInterval(checkTimer, 250);
  }

  function pauseSession() {
    clearInterval(intervalId);
    intervalId = null;
    running = false;
    // Freeze the remaining time; phaseStartedAt gets rebased on resume so the
    // paused interval doesn't count against the phase.
    pausedRemainingMs = Math.max(0, phaseTotal * 1000 - (Date.now() - phaseStartedAt));
    startBtn.textContent = 'Resume';
    statusText.textContent = 'Paused';
    releaseWakeLock();
    saveState();
  }

  function resumeSession() {
    ensureAudio();
    running = true;
    phaseStartedAt = Date.now() - (phaseTotal * 1000 - pausedRemainingMs);
    secondsLeft = computeSecondsLeft();
    startBtn.textContent = 'Pause';
    statusText.textContent = phase === 'ready' ? 'Get ready…' : 'Training…';
    requestWakeLock();
    intervalId = setInterval(checkTimer, 250);
    render();
  }

  function resetSession() {
    clearInterval(intervalId);
    intervalId = null;
    running = false;
    sessionActive = false;
    setConfigDisabled(false);
    setConfigCollapsed(false);
    startBtn.textContent = 'Start';
    releaseWakeLock();
    phase = 'idle';
    curSet = 1; curRep = 1;
    secondsLeft = 0; phaseTotal = 0;
    statusText.textContent = 'Ready to set up';
    plan = null;
    updateStaticDisplay();
    render();
    clearSavedState();
  }

  // ---- Persistence: survive backgrounding, tab discard, or a full reload ----
  // Just the plan, position, and the ideal wall-clock anchor are stored — real
  // elapsed time is always recomputed from Date.now(), so any length of gap is
  // handled the same way, whether it's a throttled timer or the OS killing the tab.
  function saveState() {
    try {
      if (!sessionActive) {
        localStorage.removeItem(STORAGE_KEY);
        return;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        plan, curSet, curRep, phase, phaseTotal, phaseStartedAt,
        running, pausedRemainingMs,
      }));
    } catch (e) { /* storage unavailable — app still works, just won't survive a reload */ }
  }
  function clearSavedState() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  // Guards against corrupted or hand-edited localStorage. A plan with a zero or
  // NaN repTime would make the catch-up loop below spin forever, so validate the
  // shape before trusting any of it.
  function isValidSavedState(s) {
    if (!s || typeof s !== 'object' || !s.plan) return false;
    const p = s.plan;
    const posInt = (v) => Number.isFinite(v) && v > 0;
    const nonNegInt = (v) => Number.isFinite(v) && v >= 0;
    if (!posInt(p.sets) || !posInt(p.reps) || !posInt(p.repTime)) return false;
    if (!nonNegInt(p.restRep) || !nonNegInt(p.restSet)) return false;
    if (!['ready', 'hang', 'rest', 'restset'].includes(s.phase)) return false;
    if (!posInt(s.curSet) || !posInt(s.curRep)) return false;
    if (s.curSet > p.sets || s.curRep > p.reps) return false;
    if (!nonNegInt(s.phaseTotal) || !Number.isFinite(s.phaseStartedAt)) return false;
    return true;
  }

  function restoreState() {
    let saved;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      saved = JSON.parse(raw);
    } catch (e) { return; }
    if (!isValidSavedState(saved)) { clearSavedState(); return; }

    plan = saved.plan;
    curSet = saved.curSet;
    curRep = saved.curRep;
    phase = saved.phase;
    phaseTotal = saved.phaseTotal;
    updateStaticDisplay();
    setConfigDisabled(true);
    setConfigCollapsed(true);
    sessionActive = true;

    if (!saved.running) {
      // Was paused — nothing elapsed, restore exactly as left.
      pausedRemainingMs = saved.pausedRemainingMs;
      phaseStartedAt = Date.now() - (phaseTotal * 1000 - pausedRemainingMs);
      secondsLeft = computeSecondsLeft();
      running = false;
      startBtn.textContent = 'Resume';
      statusText.textContent = 'Paused';
      render();
      return;
    }

    // Was running — the anchor is the ideal wall-clock start time, so however much
    // time passed (even across a reload) just falls out of computeSecondsLeft();
    // fast-forward silently through any fully-elapsed phases the same way live
    // ticking would, just without the sound bombarding on page open.
    phaseStartedAt = saved.phaseStartedAt;
    running = true;
    suppressSound = true;
    // Bounded: a full session is at most sets*reps*2 phases, so this can never
    // run away even if the saved plan somehow slipped past validation.
    let guard = plan.sets * plan.reps * 2 + 10;
    while (phase !== 'done' && computeSecondsLeft() <= 0 && guard-- > 0) {
      advancePhase();
    }
    suppressSound = false;

    if (phase === 'done') {
      // Session finished while we were away — finishSession() already ran silently
      // inside the loop, but the config was locked/collapsed above on the assumption
      // the session was still live. Hand control back so settings are editable again.
      setConfigDisabled(false);
      setConfigCollapsed(false);
      return;
    }

    secondsLeft = computeSecondsLeft();
    startBtn.textContent = 'Pause';
    statusText.textContent = phase === 'ready' ? 'Get ready…' : 'Training…';
    requestWakeLock();
    intervalId = setInterval(checkTimer, 250);
    render();
  }

  startBtn.addEventListener('click', () => {
    if (!sessionActive) {
      startSession();
    } else if (running) {
      pauseSession();
    } else {
      resumeSession();
    }
  });

  resetBtn.addEventListener('click', () => {
    resetSession();
  });

  // Rewind to a 10s get-ready countdown before rep 1 of the current set, for when
  // you miss the start of a set. Keeps the same set number, so nothing is lost from
  // the session plan — you just run this set again from the top.
  function restartCurrentSet() {
    if (!sessionActive || !plan) return;
    ensureAudio();

    // During rest-between-sets, curSet has already advanced to the set that's
    // coming up — so "restart the current set" would restart one you haven't done.
    // Step back to the set you just finished instead. The exception is the final
    // stretch of that rest: you're seconds from starting the next set anyway, so
    // keep it and just hand back a full 10s lead-in to get on the board.
    if (phase === 'restset' && secondsLeft > READY_SECONDS && curSet > 1) {
      curSet -= 1;
    }

    curRep = 1;
    // Fresh anchor: the rewound get-ready starts now, not chained from the old phase.
    startPhase('ready', READY_SECONDS);
    statusText.textContent = 'Get ready…';
    if (!running) {
      // Restarting from a paused state resumes the session, since the point is to
      // catch the start of the set rather than sit paused at the beginning of it.
      running = true;
      startBtn.textContent = 'Pause';
      requestWakeLock();
      if (!intervalId) intervalId = setInterval(checkTimer, 250);
    }
    render();
  }

  // Extend the session by one set while it's running, for when you have more in
  // the tank than you planned for. Allowed on any set, including the last.
  function addSet() {
    if (!sessionActive || !plan) return;
    if (plan.sets >= 20) return; // same ceiling as the config field
    plan.sets += 1;
    updateStaticDisplay();
    // Keep the config field in step, so the new total carries to the next session
    // and is what you see when the setup panel is reopened.
    cfgSets.value = plan.sets;
    savePrefs();
    render();
  }

  restartSetBtn.addEventListener('click', restartCurrentSet);
  addSetBtn.addEventListener('click', addSet);

  // These only make sense during a live session.
  function updateSecondaryControls() {
    const usable = sessionActive && !!plan;
    restartSetBtn.disabled = !usable;
    addSetBtn.disabled = !usable || plan.sets >= 20;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (running) requestWakeLock();
      checkTimer(); // recompute immediately on return, rather than waiting for the next poll
    }
  });

  // initial paint
  loadPrefs();
  restoreState();
  render();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {
      /* offline caching just won't be available — app still works fine online */
    });
  });
}
</script>
</body>
</html>
